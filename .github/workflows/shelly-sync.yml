name: Shelly sync

on:
  schedule:
    - cron: "*/10 * * * *"   # každých 10 minut
  workflow_dispatch: {}       # + možnost spustit ručně přes záložku Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stáhnout data ze Shelly Cloud a sestavit shelly.json
        env:
          SHELLY_AUTH_KEY: ${{ secrets.SHELLY_AUTH_KEY }}
          SHELLY_SERVER: ${{ secrets.SHELLY_SERVER }}
        run: python scripts/shelly_sync.py

      - name: Commitnout shelly.json, pokud se změnil
        run: |
          git config user.name "shelly-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add shelly.json
          if git diff --cached --quiet; then
            echo "Beze změny, nic se necommituje."
          else
            git commit -m "Aktualizace dat ze Shelly"
            git push
          fi
